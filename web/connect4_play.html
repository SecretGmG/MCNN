<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Four</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f6;
      color: #182026;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header {
      height: 64px; padding: 0 24px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid #d8dde0; background: #ffffff;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .segments { display: flex; border: 1px solid #b8c0c5; border-radius: 6px; overflow: hidden; }
    button { font: inherit; cursor: pointer; }
    .segments button, #newGame {
      min-height: 36px; border: 0; padding: 0 14px; background: #ffffff; color: #303940;
    }
    .segments button + button { border-left: 1px solid #b8c0c5; }
    .segments button.active { background: #182026; color: #ffffff; }
    #newGame { border: 1px solid #b8c0c5; border-radius: 6px; font-weight: 600; }
    main { display: grid; place-items: center; padding: 24px; min-height: 0; }
    .game { width: min(92vw, 680px); display: grid; gap: 18px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
    #status { font-size: 17px; font-weight: 650; }
    .identity { display: flex; gap: 16px; color: #566168; font-size: 14px; }
    .identity span { display: flex; align-items: center; gap: 7px; }
    .key { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.14); }
    .red { background: #d94841; }
    .yellow { background: #f1c83c; }
    .column-targets { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 0 12px; }
    .column-targets button {
      height: 32px; border: 0; background: transparent; color: #647078; font-size: 18px;
      border-radius: 4px;
    }
    .column-targets button:not(:disabled):hover { background: #dfe7eb; color: #182026; }
    .column-targets button:disabled { cursor: default; opacity: .25; }
    .board {
      width: 100%; aspect-ratio: 7 / 6; padding: 12px; display: grid;
      grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 8px;
      background: #1769aa; border: 1px solid #105789; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(20, 45, 60, .14);
    }
    .cell {
      min-width: 0; min-height: 0; aspect-ratio: 1; border-radius: 50%; background: #f7f9fa;
      box-shadow: inset 0 2px 5px rgba(15, 45, 65, .24); border: 1px solid rgba(0,0,0,.12);
    }
    .cell.p1 { background: #d94841; }
    .cell.p2 { background: #f1c83c; }
    .cell.last { outline: 3px solid #182026; outline-offset: -5px; }
    @media (max-width: 620px) {
      header { height: auto; min-height: 64px; padding: 12px 16px; gap: 12px; align-items: flex-start; }
      .controls { flex-wrap: wrap; justify-content: flex-end; }
      main { padding: 16px 10px; }
      .game { width: 100%; gap: 12px; }
      .board { gap: 5px; padding: 8px; border-radius: 6px; }
      .identity { gap: 9px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Connect Four</h1>
    <div class="controls">
      <div class="segments" aria-label="Turn order">
        <button id="first" class="active" type="button">First</button>
        <button id="second" type="button">Second</button>
      </div>
      <button id="newGame" type="button">New game</button>
    </div>
  </header>
  <main>
    <section class="game">
      <div class="status-row">
        <div id="status">Loading</div>
        <div class="identity">
          <span><i id="humanKey" class="key red"></i>You</span>
          <span><i id="modelKey" class="key yellow"></i>Model</span>
        </div>
      </div>
      <div id="targets" class="column-targets"></div>
      <div id="board" class="board" aria-label="Connect Four board"></div>
    </section>
  </main>
  <script>
    const board = document.querySelector('#board');
    const targets = document.querySelector('#targets');
    const status = document.querySelector('#status');
    const first = document.querySelector('#first');
    const second = document.querySelector('#second');
    const humanKey = document.querySelector('#humanKey');
    const modelKey = document.querySelector('#modelKey');
    let state = null;
    let humanPlayer = 1;
    let pending = false;

    for (let column = 0; column < 7; column += 1) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = '▼';
      button.title = `Drop in column ${column + 1}`;
      button.addEventListener('click', () => play(column));
      targets.append(button);
    }
    for (let row = 0; row < 6; row += 1) {
      for (let column = 0; column < 7; column += 1) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = row;
        cell.dataset.column = column;
        board.append(cell);
      }
    }

    async function request(path, payload) {
      const response = await fetch(path, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function render() {
      if (!state) return;
      status.textContent = pending ? 'Model thinking' : state.status;
      const humanFirst = humanPlayer === 1;
      humanKey.className = `key ${humanFirst ? 'red' : 'yellow'}`;
      modelKey.className = `key ${humanFirst ? 'yellow' : 'red'}`;
      const lastColumn = state.lastMove;
      let lastRow = -1;
      if (lastColumn !== null) {
        for (let row = 0; row < 6; row += 1) {
          if (state.board[row][lastColumn] !== 0) { lastRow = row; break; }
        }
      }
      document.querySelectorAll('.cell').forEach((cell) => {
        const row = Number(cell.dataset.row);
        const column = Number(cell.dataset.column);
        const value = state.board[row][column];
        cell.className = `cell ${value === 1 ? 'p1' : value === -1 ? 'p2' : ''}`;
        if (row === lastRow && column === lastColumn) cell.classList.add('last');
      });
      [...targets.children].forEach((button, column) => {
        button.disabled = pending || state.finished || state.toPlay !== humanPlayer || !state.legal[column];
      });
    }

    async function newGame() {
      pending = true; render();
      try { state = await request('/api/new', {humanPlayer}); }
      catch (error) { status.textContent = error.message; }
      finally { pending = false; render(); }
    }

    async function play(column) {
      if (pending || !state) return;
      pending = true; render();
      try {
        state = await request('/api/play', {moves: state.moves, move: column, humanPlayer});
      } catch (error) { status.textContent = error.message; }
      finally { pending = false; render(); }
    }

    function setOrder(value) {
      humanPlayer = value;
      first.classList.toggle('active', value === 1);
      second.classList.toggle('active', value === -1);
      newGame();
    }
    first.addEventListener('click', () => setOrder(1));
    second.addEventListener('click', () => setOrder(-1));
    document.querySelector('#newGame').addEventListener('click', newGame);
    newGame();
  </script>
</body>
</html>
